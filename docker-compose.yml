services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: storefront
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d storefront"]
      interval: 5s
      retries: 10

  # Production-like run: same image, two processes (web + worker).
  web:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/storefront
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
    volumes: [uploads:/app/.uploads]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    profiles: ["full"]
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/storefront
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
  uploads:
